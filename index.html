  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);

}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {

}

.btn:focus-visible {

}

svg {

&lt;div id=&quot;sfc-paper&quot; class=&quot;sfc-root&quot;&gt;
  &lt;style&gt;
    #sfc-paper {

    #sfc-paper .sfc-header {

    #sfc-paper .sfc-section {

    #sfc-paper .sfc-thesis {

    #sfc-paper .sfc-flow-node.goal {

    #sfc-paper .sfc-flow-arrow {

    #sfc-paper .sfc-challenges,

      display: grid;
      gap: 18px;
    }

    #sfc-paper .sfc-challenges {

    }

    #sfc-paper .sfc-challenge {
      border-top: 2px solid var(--border);
      display: grid;
      gap: 5px;

    #sfc-paper .sfc-two-col,
    #sfc-paper .sfc-method-grid,

    }

    #sfc-paper .sfc-column {
      display: grid;
      gap: 10px;
      min-width: 0;
    }

    #sfc-paper .sfc-column h3,
    #sfc-paper .sfc-chart-group h3 {

    }

    #sfc-paper ul,
    #sfc-paper ol {

      padding-left: 20px;
    }

    #sfc-paper li + li {

    }

    #sfc-paper .sfc-stepper {
      display: grid;
      gap: 14px;
    }

    #sfc-paper .sfc-process {
      align-items: stretch;
      display: grid;
      gap: 8px;
      grid-template-columns: repeat(7, minmax(0, auto));
    }

    #sfc-paper .sfc-process-node {

      border: 1px solid var(--border);

    #sfc-paper .sfc-process-node.is-active {
      background: color-mix(in srgb, var(--viz-series-1) 16%, transparent);

    }

    #sfc-paper .sfc-process-arrow {
      align-self: center;
      color: var(--muted-foreground);
      text-align: center;
    }

    #sfc-paper .sfc-process-node strong,
    #sfc-paper .sfc-matrix th,
    #sfc-paper .sfc-table th {
      font-weight: 500;
    }

    #sfc-paper .sfc-costs {
      display: grid;
      gap: 9px;
    }

    #sfc-paper .sfc-cost-row,
    #sfc-paper .sfc-bar-row {
      align-items: center;

      gap: 10px;
      grid-template-columns: minmax(118px, 0.8fr) minmax(120px, 2fr) auto;

    #sfc-paper .sfc-cost-track,
    #sfc-paper .sfc-bar-track,
    #sfc-paper .sfc-timeline-track {
      background: color-mix(in srgb, var(--border) 55%, transparent);
      min-height: 12px;
      overflow: hidden;
      position: relative;
    }

    #sfc-paper .sfc-cost-fill,
    #sfc-paper .sfc-bar-fill {
      background: var(--viz-series-1);
      height: 12px;
    }

    #sfc-paper .sfc-cost-row:nth-child(2) .sfc-cost-fill {
      background: var(--viz-series-2);
    }

    #sfc-paper .sfc-cost-row:nth-child(3) .sfc-cost-fill {
      background: var(--viz-series-3);
    }

    #sfc-paper .sfc-cost-row:nth-child(4) .sfc-cost-fill {
      background: var(--viz-series-5);
    }

    #sfc-paper .sfc-cost-row:nth-child(5) .sfc-cost-fill {
      background: var(--viz-series-6);
    }

    #sfc-paper .sfc-bar-fill.zero {
      min-width: 2px;
    }

    #sfc-paper .sfc-bar-fill.primary {
      background: var(--viz-series-1);
    }

    #sfc-paper .sfc-bar-fill.secondary {
      background: var(--viz-series-2);
    }

    #sfc-paper .sfc-bar-fill.tertiary {
      background: var(--viz-series-3);
    }

    #sfc-paper .sfc-bar-fill.warning {
      background: var(--viz-series-4);
    }

    #sfc-paper .sfc-table-responsive {
      max-width: 100%;
      overflow-x: auto;
    }

    #sfc-paper .sfc-table,
    #sfc-paper .sfc-matrix {
      border-collapse: collapse;
      width: 100%;
    }

    #sfc-paper .sfc-table th,
    #sfc-paper .sfc-table td,
    #sfc-paper .sfc-matrix th,
    #sfc-paper .sfc-matrix td {
      border-bottom: 1px solid var(--border);

    #sfc-paper .sfc-table td:not(:first-child),
    #sfc-paper .sfc-table th:not(:first-child),
    #sfc-paper .sfc-matrix td:not(:first-child),
    #sfc-paper .sfc-matrix th:not(:first-child) {

    #sfc-paper .sfc-yes {

    #sfc-paper .sfc-chart-group,
    #sfc-paper .sfc-exp-view,
    #sfc-paper .sfc-result-block {

    #sfc-paper .sfc-bars {
      display: grid;

    #sfc-paper .sfc-timeline {

    #sfc-paper .sfc-timeline-track {

    #sfc-paper .sfc-timeline-marker {

    #sfc-paper .sfc-timeline-labels {

    #sfc-paper .sfc-hardware {

      grid-template-columns: repeat(2, minmax(0, 1fr));

    #sfc-paper .sfc-hardware-item {

    #sfc-paper .sfc-takeaway {

    @media (prefers-reduced-motion: reduce) {
      #sfc-paper .sfc-process-node {
        transition: none;
      }
    }
  &lt;/style&gt;

  &lt;header class=&quot;sfc-header&quot;&gt;
    &lt;div class=&quot;sfc-kicker&quot;&gt;Paper explainer · Robotics · 2026&lt;/div&gt;
    &lt;h1&gt;Shooting for Contact&lt;/h1&gt;
    &lt;div class=&quot;sfc-subtitle&quot;&gt;Contact-Implicit Multiple Shooting for Dynamic Motion Retargeting&lt;/div&gt;
    &lt;div class=&quot;sfc-source text-small&quot;&gt;Sergio A. Esteban 等 · arXiv:2608.03116 · Unitree G1 / Go2 · MuJoCo + IPOPT&lt;/div&gt;
  &lt;/header&gt;

  &lt;div class=&quot;viz-grid&quot; aria-label=&quot;论文核心摘要&quot;&gt;
    &lt;div class=&quot;card viz-stat&quot;&gt;
      &lt;div class=&quot;text-muted&quot;&gt;Motivation&lt;/div&gt;
      &lt;div class=&quot;viz-stat-value&quot;&gt;动作看起来对，不等于物理上能做&lt;/div&gt;
      &lt;div&gt;运动学重定向会留下滑脚、穿透、碰撞和不可实现力矩。&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card viz-stat&quot;&gt;
      &lt;div class=&quot;text-muted&quot;&gt;Solution&lt;/div&gt;
      &lt;div class=&quot;viz-stat-value&quot;&gt;把 MuJoCo 直接放进优化器&lt;/div&gt;
      &lt;div&gt;接触模式不预设，由仿真器在每次 rollout 中自然决定。&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;card viz-stat&quot;&gt;
      &lt;div class=&quot;text-muted&quot;&gt;Experiments&lt;/div&gt;
      &lt;div class=&quot;viz-stat-value&quot;&gt;更容易学，也能上真机&lt;/div&gt;
      &lt;div&gt;RL 收敛更快，G1 完成爬行与 180° 跳转的零样本迁移。&lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;nav class=&quot;viz-controls&quot; aria-label=&quot;论文讲解章节&quot;&gt;
    &lt;button type=&quot;button&quot; class=&quot;btn btn-primary&quot; data-section-button=&quot;motivation&quot; aria-pressed=&quot;true&quot;&gt;1. Motivation&lt;/button&gt;
    &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-section-button=&quot;solution&quot; aria-pressed=&quot;false&quot;&gt;2. Solution&lt;/button&gt;
    &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-section-button=&quot;experiments&quot; aria-pressed=&quot;false&quot;&gt;3. Experiments&lt;/button&gt;
  &lt;/nav&gt;

  &lt;main&gt;
    &lt;section class=&quot;sfc-section&quot; data-section=&quot;motivation&quot;&gt;
      &lt;div&gt;
        &lt;h2&gt;Motivation：为什么普通 motion retargeting 不够？&lt;/h2&gt;
        &lt;div class=&quot;sfc-thesis&quot;&gt;机器人模仿失败，很多时候不是 RL 不够强，而是给它的参考动作本身就违反了机器人动力学。&lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;sfc-flow&quot; role=&quot;img&quot; aria-label=&quot;从人类动作到不可行参考，再到强化学习负担的流程&quot;&gt;
        &lt;div class=&quot;sfc-flow-node&quot;&gt;
          &lt;strong&gt;人类动作 / 动画 / 简化模型&lt;/strong&gt;
          &lt;span&gt;提供姿态、节奏和动作意图，例如爬行、翻转、跳跃。&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;sfc-flow-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/div&gt;
        &lt;div class=&quot;sfc-flow-node problem&quot;&gt;
          &lt;strong&gt;运动学重定向&lt;/strong&gt;
          &lt;span&gt;关节和关键点“看起来像”，但没有保证力、冲量、摩擦和执行器限制。&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;sfc-flow-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/div&gt;
        &lt;div class=&quot;sfc-flow-node goal&quot;&gt;
          &lt;strong&gt;RL 被迫同时做两件事&lt;/strong&gt;
          &lt;span&gt;既要修复不可能的参考轨迹，又要学习稳定控制，奖励权重因此很难调。&lt;/span&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div&gt;
        &lt;h3&gt;接触丰富动作为什么尤其难？&lt;/h3&gt;
        &lt;div class=&quot;sfc-challenges&quot;&gt;
          &lt;div class=&quot;sfc-challenge&quot;&gt;&lt;strong&gt;脚底滑动&lt;/strong&gt;&lt;span&gt;参考脚已经“站住”，动力学却需要继续滑动或产生不可能的摩擦力。&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;sfc-challenge&quot;&gt;&lt;strong&gt;地面穿透&lt;/strong&gt;&lt;span&gt;逐帧 IK 只对齐几何位置，可能让膝盖、手臂或脚进入地面。&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;sfc-challenge&quot;&gt;&lt;strong&gt;自碰撞&lt;/strong&gt;&lt;span&gt;人体动作映射到不同形态的机器人后，身体部件可能相互穿过。&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;sfc-challenge&quot;&gt;&lt;strong&gt;不可实现力矩&lt;/strong&gt;&lt;span&gt;动作要求的关节力矩、速度或冲量超出执行器能力。&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;sfc-challenge&quot;&gt;&lt;strong&gt;未知接触顺序&lt;/strong&gt;&lt;span&gt;爬行和滚动会使用手、肘、膝、脚，难以事先写出完整接触时序。&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;sfc-challenge&quot;&gt;&lt;strong&gt;长时域敏感&lt;/strong&gt;&lt;span&gt;早期很小的控制误差会在翻转、落地等动态动作中快速放大。&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;sfc-two-col&quot;&gt;
        &lt;div class=&quot;sfc-column&quot;&gt;
          &lt;h3&gt;没有动力学优化时&lt;/h3&gt;
          &lt;ol&gt;
            &lt;li&gt;强 tracking reward：策略被拉向无法实现的轨迹，容易摔倒。&lt;/li&gt;
            &lt;li&gt;弱 tracking reward：策略活下来了，但动作偏离原始意图。&lt;/li&gt;
            &lt;li&gt;需要更多 reward tuning、curriculum 和 domain randomization 来补救。&lt;/li&gt;
          &lt;/ol&gt;
        &lt;/div&gt;
        &lt;div class=&quot;sfc-column&quot;&gt;
          &lt;h3&gt;论文的目标&lt;/h3&gt;
          &lt;ol&gt;
            &lt;li&gt;在 RL 训练之前，先把参考动作变成整机动力学可行轨迹。&lt;/li&gt;
            &lt;li&gt;让优化器自己发现何时、何处、用哪个身体部位接触。&lt;/li&gt;
            &lt;li&gt;让 RL 主要学习“稳定这条可行轨迹”，而不是重新发明动作。&lt;/li&gt;
          &lt;/ol&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;sfc-takeaway&quot;&gt;
        &lt;strong&gt;这一节的核心&lt;/strong&gt;
        &lt;span&gt;论文把 motion retargeting 的目标从“姿态相似”提升为“姿态相似 + 接触一致 + 整机动力学可实现”。&lt;/span&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;sfc-section&quot; data-section=&quot;solution&quot; hidden&gt;
      &lt;div&gt;
        &lt;h2&gt;Solution：DSMS 是怎样工作的？&lt;/h2&gt;
        &lt;div class=&quot;sfc-thesis&quot;&gt;不显式优化接触力，也不规定接触模式；优化器只选择状态和控制，接触由 MuJoCo 的离散动力学自动解析。&lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;sfc-stepper&quot;&gt;
        &lt;div class=&quot;viz-controls&quot; aria-label=&quot;DSMS 步骤&quot;&gt;
          &lt;button type=&quot;button&quot; class=&quot;btn btn-primary&quot; data-solution-step=&quot;reference&quot; aria-pressed=&quot;true&quot;&gt;参考动作&lt;/button&gt;
          &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-solution-step=&quot;variables&quot; aria-pressed=&quot;false&quot;&gt;优化变量&lt;/button&gt;
          &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-solution-step=&quot;simulation&quot; aria-pressed=&quot;false&quot;&gt;仿真与接触&lt;/button&gt;
          &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-solution-step=&quot;optimizer&quot; aria-pressed=&quot;false&quot;&gt;IPOPT 求解&lt;/button&gt;
        &lt;/div&gt;

        &lt;div class=&quot;sfc-process&quot; role=&quot;img&quot; aria-label=&quot;DSMS 从参考轨迹到动力学可行轨迹的流程&quot;&gt;
          &lt;div class=&quot;sfc-process-node is-active&quot; data-process-node=&quot;reference&quot;&gt;
            &lt;strong&gt;参考 Xref&lt;/strong&gt;
            &lt;span&gt;来自 mocap、动画、IK 或 reduced-order model；允许动力学不一致。&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;sfc-process-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/div&gt;
          &lt;div class=&quot;sfc-process-node&quot; data-process-node=&quot;variables&quot;&gt;
            &lt;strong&gt;节点状态 X&lt;/strong&gt;
            &lt;span&gt;把长轨迹切成 N 个 shooting intervals，节点状态作为决策变量。&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;sfc-process-arrow&quot; aria-hidden=&quot;true&quot;&gt;+&lt;/div&gt;
          &lt;div class=&quot;sfc-process-node&quot; data-process-node=&quot;variables&quot;&gt;
            &lt;strong&gt;控制点 U&lt;/strong&gt;
            &lt;span&gt;用 ZOH 或线性样条生成每个仿真步的力矩或关节目标。&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;sfc-process-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/div&gt;
          &lt;div class=&quot;sfc-process-node&quot; data-process-node=&quot;simulation&quot;&gt;
            &lt;strong&gt;MuJoCo flow F&lt;/strong&gt;
            &lt;span&gt;每个区间内部做细步长积分，自动处理接触、摩擦、冲击和限位。&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;sfc-detail&quot; aria-live=&quot;polite&quot; data-solution-detail&gt;参考轨迹只定义“想要什么动作”；它可以有滑脚、穿透或不可实现力矩，DSMS 会在保留动作意图的同时修正这些问题。&lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;sfc-method-grid&quot;&gt;
        &lt;div class=&quot;sfc-column&quot;&gt;
          &lt;h3&gt;Multiple shooting 的关键约束&lt;/h3&gt;
          &lt;ul&gt;
            &lt;li&gt;每个区间从节点状态独立 rollout。&lt;/li&gt;
            &lt;li&gt;区间末端必须与下一个节点状态一致，这就是 defect constraint。&lt;/li&gt;
            &lt;li&gt;长时域被拆成短 rollout，降低梯度爆炸和动态动作的数值敏感性。&lt;/li&gt;
            &lt;li&gt;浮动基座误差位于切空间，四元数节点还带单位范数约束。&lt;/li&gt;
          &lt;/ul&gt;
        &lt;/div&gt;
        &lt;div class=&quot;sfc-column&quot;&gt;
          &lt;h3&gt;“Contact-implicit” 在这里是什么意思？&lt;/h3&gt;
          &lt;ul&gt;
            &lt;li&gt;优化变量里没有接触力 λ。&lt;/li&gt;
            &lt;li&gt;没有手写 foot-contact、hand-contact 等 mode schedule。&lt;/li&gt;
            &lt;li&gt;没有显式互补约束来表达“距离或接触力必须为零”。&lt;/li&gt;
            &lt;li&gt;只要某个候选状态进入接触，MuJoCo 就在 F(x,u) 内部产生相应接触响应。&lt;/li&gt;
          &lt;/ul&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;sfc-column&quot;&gt;
        &lt;h3&gt;优化目标由什么组成？&lt;/h3&gt;
        &lt;div class=&quot;sfc-costs&quot; aria-label=&quot;DSMS 目标函数组成示意，不代表固定权重&quot;&gt;
          &lt;div class=&quot;sfc-cost-row&quot;&gt;&lt;span&gt;状态跟踪&lt;/span&gt;&lt;div class=&quot;sfc-cost-track&quot;&gt;&lt;div class=&quot;sfc-cost-fill&quot; style=&quot;width:92%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span&gt;全身姿态与速度&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;sfc-cost-row&quot;&gt;&lt;span&gt;关键身体跟踪&lt;/span&gt;&lt;div class=&quot;sfc-cost-track&quot;&gt;&lt;div class=&quot;sfc-cost-fill&quot; style=&quot;width:82%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span&gt;手、脚、骨盆的 pose/twist&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;sfc-cost-row&quot;&gt;&lt;span&gt;执行器力矩&lt;/span&gt;&lt;div class=&quot;sfc-cost-track&quot;&gt;&lt;div class=&quot;sfc-cost-fill&quot; style=&quot;width:38%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span&gt;避免高能耗与超限&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;sfc-cost-row&quot;&gt;&lt;span&gt;控制变化率&lt;/span&gt;&lt;div class=&quot;sfc-cost-track&quot;&gt;&lt;div class=&quot;sfc-cost-fill&quot; style=&quot;width:30%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span&gt;抑制抖动&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;sfc-cost-row&quot;&gt;&lt;span&gt;终端跟踪&lt;/span&gt;&lt;div class=&quot;sfc-cost-track&quot;&gt;&lt;div class=&quot;sfc-cost-fill&quot; style=&quot;width:70%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span&gt;强化动作结尾&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;sfc-note text-small&quot;&gt;条形长度仅表示各项在方法中的角色，不是论文统一使用的数值权重。&lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;sfc-table-responsive&quot;&gt;
        &lt;table class=&quot;sfc-table&quot; aria-label=&quot;传统接触隐式优化与 DSMS 的区别&quot;&gt;
          &lt;thead&gt;&lt;tr&gt;&lt;th&gt;问题&lt;/th&gt;&lt;th&gt;传统 CITO 常见做法&lt;/th&gt;&lt;th&gt;DSMS&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
          &lt;tbody&gt;
            &lt;tr&gt;&lt;td&gt;接触变量&lt;/td&gt;&lt;td&gt;接触力、间隙、互补松弛变量&lt;/td&gt;&lt;td&gt;不显式出现，由 simulator 内部求解&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;接触时序&lt;/td&gt;&lt;td&gt;可能需要候选接触对或 mode schedule&lt;/td&gt;&lt;td&gt;无需预先规定&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;动力学模型&lt;/td&gt;&lt;td&gt;显式方程或平滑接触模型&lt;/td&gt;&lt;td&gt;直接使用 MuJoCo 离散 transition map&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;梯度&lt;/td&gt;&lt;td&gt;解析、自动微分或隐式微分&lt;/td&gt;&lt;td&gt;MuJoCo &lt;code&gt;mjd_transitionFD&lt;/code&gt; 有限差分&lt;/td&gt;&lt;/tr&gt;
            &lt;tr&gt;&lt;td&gt;NLP 求解&lt;/td&gt;&lt;td&gt;依方法而定&lt;/td&gt;&lt;td&gt;cyipopt / IPOPT，稀疏 Jacobian，L-BFGS Hessian&lt;/td&gt;&lt;/tr&gt;
          &lt;/tbody&gt;
        &lt;/table&gt;
      &lt;/div&gt;

      &lt;div class=&quot;sfc-two-col&quot;&gt;
        &lt;div class=&quot;sfc-column&quot;&gt;
          &lt;h3&gt;整段 trajectory optimization&lt;/h3&gt;
          &lt;span&gt;一次优化完整动作。适合较短、接近周期或有明确终点的动作，例如 gait clip、cartpole swing-up。&lt;/span&gt;
        &lt;/div&gt;
        &lt;div class=&quot;sfc-column&quot;&gt;
          &lt;h3&gt;Receding-horizon MPC&lt;/h3&gt;
          &lt;span&gt;不断移动参考窗口，每次只执行优化控制的前几步，再从新状态重规划。适合长动作和对误差敏感的翻转、滚动与跟踪。&lt;/span&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;sfc-takeaway&quot;&gt;
        &lt;strong&gt;这一节的核心&lt;/strong&gt;
        &lt;span&gt;DSMS 不是“优化接触力”，而是“优化会被接触仿真器推进的状态与控制”；因此任何最终轨迹都必须能被同一个仿真器真实地一步步执行出来。&lt;/span&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section class=&quot;sfc-section&quot; data-section=&quot;experiments&quot; hidden&gt;
      &lt;div&gt;
        &lt;h2&gt;Experiments：实验想证明什么？&lt;/h2&gt;
        &lt;div class=&quot;sfc-thesis&quot;&gt;论文不只比较轨迹误差，而是把优化后的参考交给同一种 RL 训练流程，看策略是否更快学会、是否更稳定落地、是否能迁移到真机。&lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;viz-controls&quot; aria-label=&quot;实验结果视图&quot;&gt;
        &lt;button type=&quot;button&quot; class=&quot;btn btn-primary&quot; data-exp-button=&quot;success&quot; aria-pressed=&quot;true&quot;&gt;成功率&lt;/button&gt;
        &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-exp-button=&quot;tracking&quot; aria-pressed=&quot;false&quot;&gt;学习与误差&lt;/button&gt;
        &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-exp-button=&quot;capability&quot; aria-pressed=&quot;false&quot;&gt;能力与真机&lt;/button&gt;
      &lt;/div&gt;

      &lt;div class=&quot;sfc-exp-view&quot; data-exp-view=&quot;success&quot;&gt;
        &lt;div class=&quot;sfc-experiment-grid&quot;&gt;
          &lt;div class=&quot;sfc-chart-group&quot;&gt;
            &lt;h3&gt;动态模型消融：backflip landing success&lt;/h3&gt;
            &lt;div class=&quot;sfc-bars&quot; role=&quot;img&quot; aria-label=&quot;SRB 0%，SRB 到 KD 0%，SRB 到 DSMS 100%，SRB 到 KD 再到 DSMS 96%&quot;&gt;
              &lt;div class=&quot;sfc-bar-row&quot;&gt;&lt;span&gt;SRB&lt;/span&gt;&lt;div class=&quot;sfc-bar-track&quot;&gt;&lt;div class=&quot;sfc-bar-fill zero warning&quot; style=&quot;width:0%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;strong&gt;0%&lt;/strong&gt;&lt;/div&gt;
              &lt;div class=&quot;sfc-bar-row&quot;&gt;&lt;span&gt;SRB → KD&lt;/span&gt;&lt;div class=&quot;sfc-bar-track&quot;&gt;&lt;div class=&quot;sfc-bar-fill zero secondary&quot; style=&quot;width:0%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;strong&gt;0%&lt;/strong&gt;&lt;/div&gt;
              &lt;div class=&quot;sfc-bar-row&quot;&gt;&lt;span&gt;SRB → DSMS&lt;/span&gt;&lt;div class=&quot;sfc-bar-track&quot;&gt;&lt;div class=&quot;sfc-bar-fill primary&quot; style=&quot;width:100%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;strong&gt;100%&lt;/strong&gt;&lt;/div&gt;
              &lt;div class=&quot;sfc-bar-row&quot;&gt;&lt;span&gt;SRB → KD → DSMS&lt;/span&gt;&lt;div class=&quot;sfc-bar-track&quot;&gt;&lt;div class=&quot;sfc-bar-fill tertiary&quot; style=&quot;width:96%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;strong&gt;96%&lt;/strong&gt;&lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;sfc-note&quot;&gt;同一类 SRB/kinodynamic 初始参考，只有经过 full-order DSMS 的轨迹能被策略稳定学会并落地。&lt;/div&gt;
          &lt;/div&gt;

          &lt;div class=&quot;sfc-chart-group&quot;&gt;
            &lt;h3&gt;方法比较：super hero backflip success&lt;/h3&gt;
            &lt;div class=&quot;sfc-bars&quot; role=&quot;img&quot; aria-label=&quot;OmniRetarget 9.3%，BONES-SEED 80%，DynaRetarget 98.7%，DSMS 98.7%&quot;&gt;
              &lt;div class=&quot;sfc-bar-row&quot;&gt;&lt;span&gt;OmniRetarget&lt;/span&gt;&lt;div class=&quot;sfc-bar-track&quot;&gt;&lt;div class=&quot;sfc-bar-fill warning&quot; style=&quot;width:9.3%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;strong&gt;9.3%&lt;/strong&gt;&lt;/div&gt;
              &lt;div class=&quot;sfc-bar-row&quot;&gt;&lt;span&gt;BONES-SEED&lt;/span&gt;&lt;div class=&quot;sfc-bar-track&quot;&gt;&lt;div class=&quot;sfc-bar-fill secondary&quot; style=&quot;width:80%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;strong&gt;80.0%&lt;/strong&gt;&lt;/div&gt;
              &lt;div class=&quot;sfc-bar-row&quot;&gt;&lt;span&gt;DynaRetarget&lt;/span&gt;&lt;div class=&quot;sfc-bar-track&quot;&gt;&lt;div class=&quot;sfc-bar-fill tertiary&quot; style=&quot;width:98.7%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;strong&gt;98.7%&lt;/strong&gt;&lt;/div&gt;
              &lt;div class=&quot;sfc-bar-row&quot;&gt;&lt;span&gt;DSMS&lt;/span&gt;&lt;div class=&quot;sfc-bar-track&quot;&gt;&lt;div class=&quot;sfc-bar-fill primary&quot; style=&quot;width:98.7%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;strong&gt;98.7%&lt;/strong&gt;&lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;sfc-note&quot;&gt;DSMS 与 DynaRetarget 成功率相同，但 DSMS 的关节与 base pose 跟踪误差明显更低。&lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;

        &lt;div class=&quot;sfc-result-block&quot;&gt;
          &lt;h3&gt;怎样解读这些成功率？&lt;/h3&gt;
          &lt;ul&gt;
            &lt;li&gt;实验不是在优化器内部评估，而是训练独立的 motion-tracking policy 后，在带异步控制、传感与初始状态随机化的 MuJoCo 环境中测试。&lt;/li&gt;
            &lt;li&gt;每种轨迹训练 5 个随机种子；landing 总计按 75 次 rollout 统计。&lt;/li&gt;
            &lt;li&gt;结果支持论文的核心假设：参考轨迹越符合整机动力学，后续 RL 越容易收敛并复现动作。&lt;/li&gt;
          &lt;/ul&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;sfc-exp-view&quot; data-exp-view=&quot;tracking&quot; hidden&gt;
        &lt;div class=&quot;sfc-column&quot;&gt;
          &lt;h3&gt;Super hero backflip：成功落地后的跟踪误差&lt;/h3&gt;
          &lt;div class=&quot;sfc-table-responsive&quot;&gt;
            &lt;table class=&quot;sfc-table&quot; aria-label=&quot;不同重定向方法的成功率、关节误差和位姿误差&quot;&gt;
              &lt;thead&gt;&lt;tr&gt;&lt;th&gt;方法&lt;/th&gt;&lt;th&gt;成功&lt;/th&gt;&lt;th&gt;Joint error&lt;/th&gt;&lt;th&gt;Pose error&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
              &lt;tbody&gt;
                &lt;tr&gt;&lt;td&gt;OmniRetarget&lt;/td&gt;&lt;td&gt;9.3%&lt;/td&gt;&lt;td&gt;0.157 ± 0.001 rad&lt;/td&gt;&lt;td&gt;0.095 ± 0.014&lt;/td&gt;&lt;/tr&gt;
                &lt;tr&gt;&lt;td&gt;BONES-SEED&lt;/td&gt;&lt;td&gt;80.0%&lt;/td&gt;&lt;td&gt;0.195 ± 0.003 rad&lt;/td&gt;&lt;td&gt;0.146 ± 0.027&lt;/td&gt;&lt;/tr&gt;
                &lt;tr&gt;&lt;td&gt;DynaRetarget&lt;/td&gt;&lt;td&gt;98.7%&lt;/td&gt;&lt;td&gt;0.237 ± 0.006 rad&lt;/td&gt;&lt;td&gt;0.160 ± 0.077&lt;/td&gt;&lt;/tr&gt;
                &lt;tr&gt;&lt;td&gt;&lt;strong&gt;DSMS&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;&lt;strong&gt;98.7%&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;&lt;strong&gt;0.159 ± 0.006 rad&lt;/strong&gt;&lt;/td&gt;&lt;td&gt;&lt;strong&gt;0.102 ± 0.046&lt;/strong&gt;&lt;/td&gt;&lt;/tr&gt;
              &lt;/tbody&gt;
            &lt;/table&gt;
          &lt;/div&gt;
          &lt;div class=&quot;sfc-note text-small&quot;&gt;误差只在成功落地的 rollout 上统计；pose error 对位置按机器人身高归一化，对姿态按 180° 归一化。&lt;/div&gt;
        &lt;/div&gt;

        &lt;div class=&quot;sfc-column&quot;&gt;
          &lt;h3&gt;训练收敛速度&lt;/h3&gt;
          &lt;div class=&quot;sfc-timeline&quot; role=&quot;img&quot; aria-label=&quot;DSMS 大约 2000 次训练迭代达到平均奖励 20，最接近的方法约 5000 次&quot;&gt;
            &lt;div class=&quot;sfc-timeline-track&quot;&gt;
              &lt;div class=&quot;sfc-timeline-marker&quot; style=&quot;left:33.3%&quot;&gt;&lt;/div&gt;
              &lt;div class=&quot;sfc-timeline-marker competitor&quot; style=&quot;left:83.3%&quot;&gt;&lt;/div&gt;
            &lt;/div&gt;
            &lt;div class=&quot;sfc-timeline-labels&quot;&gt;&lt;span&gt;0&lt;/span&gt;&lt;span&gt;DSMS ≈ 2k&lt;/span&gt;&lt;span&gt;closest competitors ≈ 5k&lt;/span&gt;&lt;span&gt;6k iterations&lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;
          &lt;ul&gt;
            &lt;li&gt;DSMS 约 2000 次迭代达到平均 reward 20，最接近的竞争方法约需 5000 次。&lt;/li&gt;
            &lt;li&gt;论文在 RTX 4090 上报告约 40 分钟训练时间差。&lt;/li&gt;
            &lt;li&gt;DSMS 本身优化约 12 分钟，因此即便计入预处理，也具有总体时间收益。&lt;/li&gt;
          &lt;/ul&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;sfc-exp-view&quot; data-exp-view=&quot;capability&quot; hidden&gt;
        &lt;div class=&quot;sfc-column&quot;&gt;
          &lt;h3&gt;方法能力对比&lt;/h3&gt;
          &lt;div class=&quot;sfc-table-responsive&quot;&gt;
            &lt;table class=&quot;sfc-matrix&quot; aria-label=&quot;OmniRetarget、DynaRetarget、SPARK 和 DSMS 的能力矩阵&quot;&gt;
              &lt;thead&gt;&lt;tr&gt;&lt;th&gt;能力&lt;/th&gt;&lt;th&gt;OmniRetarget&lt;/th&gt;&lt;th&gt;DynaRetarget&lt;/th&gt;&lt;th&gt;SPARK&lt;/th&gt;&lt;th&gt;DSMS&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
              &lt;tbody&gt;
                &lt;tr&gt;&lt;td&gt;Kinematic feasibility&lt;/td&gt;&lt;td class=&quot;sfc-yes&quot;&gt;✓&lt;/td&gt;&lt;td class=&quot;sfc-yes&quot;&gt;✓&lt;/td&gt;&lt;td class=&quot;sfc-yes&quot;&gt;✓&lt;/td&gt;&lt;td class=&quot;sfc-yes&quot;&gt;✓&lt;/td&gt;&lt;/tr&gt;
                &lt;tr&gt;&lt;td&gt;Whole-body dynamic feasibility&lt;/td&gt;&lt;td class=&quot;sfc-no&quot;&gt;—&lt;/td&gt;&lt;td class=&quot;sfc-yes&quot;&gt;✓&lt;/td&gt;&lt;td class=&quot;sfc-no&quot;&gt;—&lt;/td&gt;&lt;td class=&quot;sfc-yes&quot;&gt;✓&lt;/td&gt;&lt;/tr&gt;
                &lt;tr&gt;&lt;td&gt;Contact-implicit&lt;/td&gt;&lt;td class=&quot;sfc-yes&quot;&gt;✓&lt;/td&gt;&lt;td class=&quot;sfc-yes&quot;&gt;✓&lt;/td&gt;&lt;td class=&quot;sfc-no&quot;&gt;—&lt;/td&gt;&lt;td class=&quot;sfc-yes&quot;&gt;✓&lt;/td&gt;&lt;/tr&gt;
                &lt;tr&gt;&lt;td&gt;Arbitrary constraints&lt;/td&gt;&lt;td class=&quot;sfc-no&quot;&gt;—&lt;/td&gt;&lt;td class=&quot;sfc-no&quot;&gt;—&lt;/td&gt;&lt;td class=&quot;sfc-yes&quot;&gt;✓&lt;/td&gt;&lt;td class=&quot;sfc-yes&quot;&gt;✓&lt;/td&gt;&lt;/tr&gt;
              &lt;/tbody&gt;
            &lt;/table&gt;
          &lt;/div&gt;
        &lt;/div&gt;

        &lt;div class=&quot;sfc-column&quot;&gt;
          &lt;h3&gt;真机与任务展示&lt;/h3&gt;
          &lt;div class=&quot;sfc-hardware&quot;&gt;
            &lt;div class=&quot;sfc-hardware-item&quot;&gt;&lt;strong&gt;180° jump-turn&lt;/strong&gt;&lt;span&gt;由 single-rigid-body 参考经 DSMS 生成，策略在 Unitree G1 上零样本完成起跳、转身和稳定落地。&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;sfc-hardware-item&quot;&gt;&lt;strong&gt;Command-conditioned crawling&lt;/strong&gt;&lt;span&gt;单一策略根据前后、横向和转向速度命令切换周期 gait，穿过低矮空间、粗糙区域并在草地上坡。&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;sfc-hardware-item&quot;&gt;&lt;strong&gt;Whole-body contacts&lt;/strong&gt;&lt;span&gt;展示 backflip、side roll、crawl、quadruped jump-turn 等使用手、肘、膝、脚的动作。&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;sfc-hardware-item&quot;&gt;&lt;strong&gt;Velocity tracking&lt;/strong&gt;&lt;span&gt;爬行瞬时速度随 gait phase 大幅振荡，但每个命令区间的周期平均速度跟随目标趋势。&lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;
        &lt;/div&gt;

        &lt;div class=&quot;sfc-two-col&quot;&gt;
          &lt;div class=&quot;sfc-column&quot;&gt;
            &lt;h3&gt;论文真正证明了什么&lt;/h3&gt;
            &lt;ul&gt;
              &lt;li&gt;full-order 动力学可行参考能显著改善 motion-imitation RL。&lt;/li&gt;
              &lt;li&gt;仿真器内生接触足以支持复杂、未知的全身接触模式。&lt;/li&gt;
              &lt;li&gt;相同方法可以覆盖 torque control、position control、单次优化与 MPC。&lt;/li&gt;
            &lt;/ul&gt;
          &lt;/div&gt;
          &lt;div class=&quot;sfc-column&quot;&gt;
            &lt;h3&gt;还没有证明什么&lt;/h3&gt;
            &lt;ul&gt;
              &lt;li&gt;IPOPT 只能保证局部解，结果依赖初始参考和 warm start。&lt;/li&gt;
              &lt;li&gt;MuJoCo 接触有限差分在更复杂环境中的数值稳定性与计算成本仍是限制。&lt;/li&gt;
              &lt;li&gt;仓库公开的是 DSMS/MPC 参考实现，不包含论文完整 RL 训练和硬件部署栈。&lt;/li&gt;
            &lt;/ul&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;

      &lt;div class=&quot;sfc-takeaway&quot;&gt;
        &lt;strong&gt;这一节的核心&lt;/strong&gt;
        &lt;span&gt;DSMS 的价值不只是“轨迹更物理”，而是这种物理一致性会直接转化为更快的策略学习、更高的动作成功率和更可靠的 sim-to-real。&lt;/span&gt;
      &lt;/div&gt;
    &lt;/section&gt;
  &lt;/main&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;sfc-paper&#x27;);
      if (!root) return;

      const sectionButtons = [...root.querySelectorAll(&#x27;[data-section-button]&#x27;)];
      const sections = [...root.querySelectorAll(&#x27;[data-section]&#x27;)];

      function selectSection(name) {
        sectionButtons.forEach((button) =&gt; {
          const selected = button.dataset.sectionButton === name;
          button.setAttribute(&#x27;aria-pressed&#x27;, String(selected));
          button.classList.toggle(&#x27;btn-primary&#x27;, selected);
        });
        sections.forEach((section) =&gt; {
          section.hidden = section.dataset.section !== name;
        });
      }

      sectionButtons.forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; selectSection(button.dataset.sectionButton));
      });

      const solutionText = {
        reference: &#x27;参考轨迹只定义“想要什么动作”；它可以有滑脚、穿透或不可实现力矩，DSMS 会在保留动作意图的同时修正这些问题。&#x27;,
        variables: &#x27;优化变量是 shooting-node 状态与样条控制点。节点缩短了敏感 rollout，样条减少了控制维度并提供平滑或分段常值控制。&#x27;,
        simulation: &#x27;每个 shooting interval 内部执行多个细粒度 MuJoCo step。接触、摩擦、冲击、自碰撞和关节限位都发生在这个 transition map 内部。&#x27;,
        optimizer: &#x27;IPOPT 最小化跟踪与控制代价，同时把区间末端和下一节点之间的 defect 压到零；MuJoCo 有限差分提供一阶动力学敏感度。&#x27;
      };
      const solutionButtons = [...root.querySelectorAll(&#x27;[data-solution-step]&#x27;)];
      const processNodes = [...root.querySelectorAll(&#x27;[data-process-node]&#x27;)];
      const solutionDetail = root.querySelector(&#x27;[data-solution-detail]&#x27;);

      function selectSolutionStep(name) {
        solutionButtons.forEach((button) =&gt; {
          const selected = button.dataset.solutionStep === name;
          button.setAttribute(&#x27;aria-pressed&#x27;, String(selected));
          button.classList.toggle(&#x27;btn-primary&#x27;, selected);
        });
        processNodes.forEach((node) =&gt; {
          node.classList.toggle(&#x27;is-active&#x27;, node.dataset.processNode === name);
        });
        if (solutionDetail) solutionDetail.textContent = solutionText[name];
      }

      solutionButtons.forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; selectSolutionStep(button.dataset.solutionStep));
      });

      const expButtons = [...root.querySelectorAll(&#x27;[data-exp-button]&#x27;)];
      const expViews = [...root.querySelectorAll(&#x27;[data-exp-view]&#x27;)];

      function selectExperiment(name) {
        expButtons.forEach((button) =&gt; {
          const selected = button.dataset.expButton === name;
          button.setAttribute(&#x27;aria-pressed&#x27;, String(selected));
          button.classList.toggle(&#x27;btn-primary&#x27;, selected);
        });
        expViews.forEach((view) =&gt; {
          view.hidden = view.dataset.expView !== name;
        });
      }

      expButtons.forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; selectExperiment(button.dataset.expButton));
      });
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
&lt;script id=&quot;codex-visualization-lucide&quot; async src=&quot;https://unpkg.com/lucide@1.17.0/dist/umd/lucide.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  const initialize = () =&gt; {
    globalThis.lucide?.createIcons({ attrs: { width: 16, height: 16 } });
  };
  if (globalThis.lucide != null) {
    initialize();
    return;
  }
  document
    .getElementById(&quot;codex-visualization-lucide&quot;)
    ?.addEventListener(&quot;load&quot;, initialize, { once: true });
})();
&lt;/script&gt;
